<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2048 &middot; NEON ARCADE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128290;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
  <script src="../../assets/js/core.js"></script>
  <script src="../../assets/js/scores.js" defer></script>
  <script src="game.js" defer></script>
  <style>
    .game-wrap { --accent: var(--neon-3); }

    #board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .tile {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-family: var(--font-display);
      font-size: clamp(9px, 3.4vw, 16px);
      color: var(--text);
      transition: background .12s, color .12s, border-color .12s;
    }
    .tile.empty { opacity: .45; }
    .tile.pop { animation: pop .16s ease-out; }

    @keyframes pop {
      0%   { transform: scale(.7); }
      100% { transform: scale(1); }
    }

    /* Value colours: cool neons climbing to hot ones. */
    .tile[data-v="2"]    { background: #1b2a4a; color: #9fd8ff; border-color: #2b4a7a; }
    .tile[data-v="4"]    { background: #1b3a4a; color: #8ff0ff; border-color: #2b6a7a; }
    .tile[data-v="8"]    { background: #103d3a; color: #6bffe0; border-color: #1c6d66; }
    .tile[data-v="16"]   { background: #0f4430; color: #58ffb0; border-color: #1b7a56; }
    .tile[data-v="32"]   { background: #2a4a10; color: #b6ff58; border-color: #4c7a1c; }
    .tile[data-v="64"]   { background: #4a4210; color: #ffe45c; border-color: #7a6c1c; }
    .tile[data-v="128"]  { background: #4a3110; color: #ffc25c; border-color: #7a521c; }
    .tile[data-v="256"]  { background: #4a2110; color: #ff9d5c; border-color: #7a3a1c; }
    .tile[data-v="512"]  { background: #4a1030; color: #ff6bb0; border-color: #7a1c55; }
    .tile[data-v="1024"] { background: #3a1046; color: #d98bff; border-color: #631c7a; font-size: clamp(8px, 2.9vw, 14px); }
    .tile[data-v="2048"] { background: #ff2d95; color: #12122a; border-color: #ff8ac4; font-size: clamp(8px, 2.9vw, 14px); }
    .tile[data-v="4096"], .tile[data-v="8192"] { background: #00e5ff; color: #07070f; border-color: #9ff4ff; font-size: clamp(8px, 2.9vw, 14px); }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="n1">NEON</span> <span class="n2">ARCADE</span></a>
    <span class="spacer"></span>
    <button class="btn" id="player-name" type="button">Set name</button>
    <button class="btn icon" id="theme-toggle" type="button" aria-label="Switch theme">&#9728;</button>
  </header>

  <main class="game-wrap">
    <div class="game-head">
      <h1>&#128290; 2048</h1>
      <span class="hint">Arrow keys / WASD / swipe</span>
    </div>

    <div class="stats">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="stat"><div class="label">Top tile</div><div class="value" id="top-tile">2</div></div>
    </div>

    <div class="stage">
      <div id="board" aria-label="2048 board"></div>

      <div class="overlay" id="overlay" hidden>
        <h2 id="over-title">GAME OVER</h2>
        <p id="over-text"></p>
        <button class="btn primary" id="over-btn" type="button">Play again</button>
      </div>
    </div>

    <div class="dpad">
      <button class="up" data-dir="up" type="button" aria-label="Up">&#9650;</button>
      <button class="left" data-dir="left" type="button" aria-label="Left">&#9664;</button>
      <button class="down" data-dir="down" type="button" aria-label="Down">&#9660;</button>
      <button class="right" data-dir="right" type="button" aria-label="Right">&#9654;</button>
    </div>

    <div class="controls">
      <button class="btn" id="restart-btn" type="button">New game</button>
      <a class="btn" href="../../index.html">All games</a>
    </div>

    <h2 class="section-title" style="margin-top:28px">Top scores</h2>
    <ol class="scorelist" id="scores"></ol>
  </main>

</body>
</html>
