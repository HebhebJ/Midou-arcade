<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snake &middot; NEON ARCADE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128013;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
  <script src="../../assets/js/core.js"></script>
  <script src="../../assets/js/scores.js" defer></script>
  <script src="game.js" defer></script>
  <style>
    .game-wrap { --accent: var(--neon-4); }
    #board { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--bg); touch-action: none; }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="n1">NEON</span> <span class="n2">ARCADE</span></a>
    <span class="spacer"></span>
    <button class="btn" id="player-name" type="button">Set name</button>
    <button class="btn icon" id="theme-toggle" type="button" aria-label="Switch theme">&#9728;</button>
  </header>

  <main class="game-wrap">
    <div class="game-head">
      <h1>&#128013; SNAKE</h1>
      <span class="hint">Arrow keys / WASD / swipe &middot; Space to pause</span>
    </div>

    <div class="stats">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="stat"><div class="label">Length</div><div class="value" id="length">3</div></div>
    </div>

    <div class="stage">
      <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="over-title">READY?</h2>
        <p id="over-text">Eat the glowing pellets. Hitting a wall or yourself ends the run.</p>
        <button class="btn primary" id="over-btn" type="button">Start</button>
      </div>
    </div>

    <div class="dpad">
      <button class="up" data-dir="up" type="button" aria-label="Up">&#9650;</button>
      <button class="left" data-dir="left" type="button" aria-label="Left">&#9664;</button>
      <button class="down" data-dir="down" type="button" aria-label="Down">&#9660;</button>
      <button class="right" data-dir="right" type="button" aria-label="Right">&#9654;</button>
    </div>

    <div class="controls">
      <button class="btn" id="pause-btn" type="button">Pause</button>
      <button class="btn" id="restart-btn" type="button">Restart</button>
      <a class="btn" href="../../index.html">All games</a>
    </div>

    <h2 class="section-title" style="margin-top:28px">Top scores</h2>
    <ol class="scorelist" id="scores"></ol>
  </main>

</body>
</html>
